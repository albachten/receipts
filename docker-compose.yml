services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8666:8666"
    volumes:
      - ./data:/app/data
    # Secrets (SECRET_KEY, EMAIL_*) live in .env, which is never committed. See .env.example.
    env_file: .env
    environment:
      DEBUG: "False"
      ALLOWED_HOSTS: home.albachten.com
      SCRIPT_NAME: /receipts
      CSRF_TRUSTED_ORIGINS: https://home.albachten.com
