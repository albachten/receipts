services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8666:8666"
    volumes:
      - ./data:/app/data
    environment:
      SECRET_KEY: change-this-and-do-not-commit-it
      DEBUG: "False"
      ALLOWED_HOSTS: home.albachten.com
      SCRIPT_NAME: /receipts
      CSRF_TRUSTED_ORIGINS: https://home.albachten.com
