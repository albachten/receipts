{% extends "auth_base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<p class="sub">Enter your username or email and we'll email you a link to reset your password.</p>
<form method="post">
  {% csrf_token %}
  {{ form.email.errors }}
  <label>Username or email<input type="text" name="email" autocomplete="username" autofocus required></label>
  <button type="submit">Send reset link</button>
</form>
<div class="links"><a href="{% url 'login' %}">Back to sign in</a></div>
{% endblock %}
